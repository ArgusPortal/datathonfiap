# =============================================================================
# Passos Mágicos — Docker Compose
# =============================================================================
# Uso:
#   docker compose up --build              → sobe api + frontend (2 containers)
#   docker compose --profile full up --build → sobe fullstack (1 container)
# =============================================================================

services:

  # ---- Backend API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - METRICS_ENABLED=true
      - AUDIT_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    profiles: ["default", ""]

  # ---- Frontend (nginx SPA + proxy para api) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["default", ""]

  # ---- Full-stack (1 container: nginx + uvicorn) ----
  fullstack:
    image: argussportal/passos-magicos-fullstack:latest
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    ports:
      - "80:80"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - METRICS_ENABLED=true
      - AUDIT_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    profiles: ["full"]
